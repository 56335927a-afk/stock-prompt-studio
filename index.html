<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3f1">
<meta name="description" content="스톡 일러스트 이미지 생성용 프롬프트를 빠르게 만드는 도구">
<link rel="manifest" href="manifest.webmanifest">
<title>MoA Prompt Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
<header class="hero">
  <div>
    <span class="eyebrow">STOCK PROMPT MAKER</span>
    <h1>MoA Prompt Studio ✨</h1>
    <p>키워드와 그림체만 고르면, 바로 붙여넣을 수 있는 스톡 일러스트 프롬프트를 만들어줘요.</p>
  </div>
  <div class="hero-badges">
    <span>API 없음</span><span>추가 비용 없음</span><span id="monthBadge">시즌 계산 중</span>
  </div>
</header>

<main class="layout">
<section class="panel controls">
  <div class="section-head">
    <div><span class="step">01</span><h2>키워드 고르기</h2></div>
    <button class="icon-btn" id="clearBtn" type="button">초기화</button>
  </div>

  <div class="keyword-row">
    <input id="keyword" placeholder="예: 벚꽃, 자동차, 분리수거" autocomplete="off">
    <button id="make" class="primary-btn" type="button">프롬프트 만들기</button>
  </div>

  <div class="recommend-grid">
    <button id="season" class="recommend season" type="button">
      <b>🌿 시즌 추천</b><small>현재 달 기준 2~3개월 뒤</small>
    </button>
    <button id="random" class="recommend random" type="button">
      <b>🎲 완전 랜덤</b><small>계절 상관없이 아무 키워드</small>
    </button>
  </div>
  <div id="chips" class="chips"></div>

  <div class="recent-wrap">
    <span class="micro-title">최근 키워드</span>
    <div id="recent" class="recent"></div>
  </div>

  <div class="divider"></div>

  <div class="section-head">
    <div><span class="step">02</span><h2>그림체 고르기</h2></div>
    <label class="fav-toggle"><input id="favOnly" type="checkbox"> 즐겨찾기만</label>
  </div>

  <div class="style-tools">
    <select id="cat"></select>
    <input id="search" placeholder="그림체 검색">
  </div>
  <div id="styles" class="styles"></div>

  <div class="divider"></div>

  <div class="section-head">
    <div><span class="step">03</span><h2>기본 설정</h2></div>
  </div>
  <div class="settings">
    <label><input id="five" type="checkbox" checked><span>정확히 5개 요소</span></label>
    <label><input id="space" type="checkbox" checked><span>요소 간격 최대</span></label>
    <label><input id="transparent" type="checkbox" checked><span>투명 PNG</span></label>
    <label><input id="notext" type="checkbox" checked><span>글자·숫자·로고 금지</span></label>
  </div>
</section>

<section class="panel result">
  <div class="result-sticky">
    <div class="section-head result-head">
      <div><span class="step">04</span><h2>완성 프롬프트</h2></div>
      <span id="styleBadge" class="style-badge">파스텔 크레용</span>
    </div>

    <div class="preview-card">
      <div class="preview-copy">
        <span class="preview-label">선택된 그림체</span>
        <strong id="selectedStyleName">파스텔 크레용</strong>
        <small id="selectedStyleDesc">부드러운 크레용·색연필 질감</small>
      </div>
      <div id="heroPreview" class="hero-preview preview-crayon" aria-hidden="true">
        <div class="gift"><i></i><b></b></div>
      </div>
    </div>

    <textarea id="prompt" placeholder="왼쪽에서 키워드와 그림체를 고른 뒤 프롬프트 만들기를 눌러주세요."></textarea>

    <div class="result-actions">
      <button id="copy" class="primary-btn" type="button">📋 프롬프트 복사</button>
      <button id="variation" class="secondary-btn" type="button">🔄 다른 요소 조합</button>
    </div>
    <button id="chat" class="chat-btn" type="button">ChatGPT 열기 ↗</button>
    <div id="msg" class="message">준비 완료. 키워드를 골라보세요.</div>
  </div>
</section>
</main>
</div>

<div class="mobile-bar">
  <button id="mobileCopy" class="primary-btn" type="button">📋 복사</button>
  <button id="mobileChat" class="secondary-btn" type="button">ChatGPT 열기</button>
</div>
<script src="app.js"></script>
</body>
</html>
