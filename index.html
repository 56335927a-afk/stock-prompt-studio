<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3f1"><title>MoA Prompt Studio</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><section class="hero"><h1>MoA Prompt Studio ✨</h1><p>스톡 일러스트 프롬프트를 빠르게 만드는 개인용 도구</p><div class="badges"><span class="badge">API 없음</span><span class="badge">추가 비용 없음</span><span class="badge" id="monthBadge">시즌 계산 중</span></div></section><div class="grid"><section class="card"><h2>1. 키워드 선택</h2><div class="row"><input id="keyword" class="grow" placeholder="예: 벚꽃, 자동차, 분리수거"><button id="make" class="btn primary">만들기</button></div><div class="dual"><button id="season" class="btn rose">🌿 2~3개월 뒤 시즌 추천</button><button id="random" class="btn">🎲 완전 랜덤 추천</button></div><div id="chips" class="chips"></div><div class="sep"></div><h2>2. 그림체 선택</h2><div class="toolbar"><select id="cat"></select><input id="search" placeholder="그림체 검색"></div><div id="styles" class="styles"></div><div class="sep"></div><h2>3. 기본 설정</h2><div class="settings"><label class="toggle"><input id="five" type="checkbox" checked> 정확히 5개 요소</label><label class="toggle"><input id="space" type="checkbox" checked> 요소 간격 최대</label><label class="toggle"><input id="transparent" type="checkbox" checked> 투명 PNG</label><label class="toggle"><input id="notext" type="checkbox" checked> 글자·숫자·로고 금지</label></div></section><section class="card"><h2>완성 프롬프트</h2><textarea id="prompt" placeholder="키워드와 그림체를 선택한 뒤 '만들기'를 눌러주세요."></textarea><div class="actions"><button id="copy" class="btn primary">📋 복사</button><button id="variation" class="btn">🔄 다른 버전</button></div><div id="msg" class="msg">준비 완료</div></section></div></div><div class="bottom"><div class="bottomin"><button id="copy2" class="btn primary">📋 프롬프트 복사</button><button id="chat" class="btn rose">ChatGPT 열기</button></div></div><script src="app.js"></script></body></html>
