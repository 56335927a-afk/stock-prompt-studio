<style>
:root{--bg:#f7f3f1;--card:#fff;--ink:#3d332f;--muted:#887a74;--line:#eaded8;--rose:#f3dfdc;--lav:#e8e0f4}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf8f6,#f5f1ef);color:var(--ink);font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.page{max-width:1180px;margin:auto;padding:18px 15px 105px}
.hero{background:linear-gradient(135deg,#f4e6e2,#eee8f8);border:1px solid #eaded9;border-radius:28px;padding:24px;box-shadow:0 14px 35px rgba(65,45,35,.06);margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:900;color:#9a756a}.hero h1{margin:6px 0 7px;font-size:30px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.badge{font-size:11px;background:rgba(255,255,255,.75);border:1px solid rgba(125,95,85,.12);padding:7px 10px;border-radius:999px}
.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 8px 25px rgba(70,50,40,.045)}
.section{margin-bottom:20px}.section:last-child{margin-bottom:0}.section-title{display:flex;align-items:center;gap:9px;margin:0 0 12px}.num{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#f3e6e2;font-weight:900;font-size:12px}.section-title h2{font-size:17px;margin:0}
.row{display:flex;gap:8px}.grow{flex:1}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:12px 13px;outline:none}
textarea{min-height:355px;resize:vertical;line-height:1.55;font-size:13px}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:850;min-height:45px;background:#efe8e4;color:var(--ink)}.btn.primary{background:var(--ink);color:#fff}.btn.rose{background:#f6e7e3}.btn.lav{background:#eee8f8}
.reco{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.reco button{text-align:left}.reco b{display:block;font-size:13px}.reco small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.chips,.recent{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;color:var(--ink)}.micro{font-size:11px;font-weight:850;color:var(--muted);display:block;margin-top:12px}
.divider{height:1px;background:var(--line);margin:18px 0}.tools{display:grid;grid-template-columns:125px 1fr auto;gap:8px;margin-bottom:10px}.favonly{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:13px;padding:0 10px;font-size:11px;white-space:nowrap}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:560px;overflow:auto;padding:3px}.style{position:relative;border:1px solid var(--line);border-radius:17px;padding:9px;background:#fff;text-align:left;color:var(--ink)}.style.active{outline:3px solid #d5a89d;border-color:#d5a89d}
.thumb{height:78px;border-radius:12px;background:linear-gradient(135deg,#f5dfdb,#e5def2);display:grid;place-items:center;font-size:32px;margin-bottom:8px}.style strong{display:block;font-size:12px;padding-right:22px}.style small{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{position:absolute;right:9px;bottom:26px;font-size:18px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.settings label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:13px;background:#fbf9f8;padding:10px;font-size:12px}.settings input{width:18px;height:18px}
.resultHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.styleBadge{font-size:11px;background:#f3e6e2;padding:7px 9px;border-radius:999px}.selectedCard{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:linear-gradient(135deg,#fffafa,#faf8fd);border-radius:17px;padding:13px;margin-bottom:10px}.selectedCard b{font-size:14px}.selectedCard small{display:block;color:var(--muted);margin-top:3px}.bigEmoji{font-size:35px}

</style>

<body>
<div class="page">
<header class="hero"><span class="eyebrow">STOCK PROMPT MAKER</span><h1>PickStock ✨</h1><p>키워드와 그림체만 고르면 생성형 AI에 바로 붙여넣을 수 있는 스톡 일러스트 프롬프트를 만들어요.</p><div class="badges"><span class="badge" id="monthBadge">시즌 계산 중</span></div></header>
<main class="layout">
<section class="panel">
<div class="section"><div class="section-title"><span class="num">01</span><h2>키워드 고르기</h2></div><div class="row"><input id="keyword" class="grow" placeholder="예: 벚꽃, 자동차, 분리수거" autocomplete="off"><button id="make" class="btn primary" type="button">프롬프트 만들기</button></div><div class="reco"><button id="season" class="btn rose" type="button"><b>🌿 시즌 추천</b><small>현재 달 기준 2~3개월 뒤</small></button><button id="random" class="btn lav" type="button"><b>🎲 완전 랜덤</b><small>계절 상관없이 아무 키워드</small></button></div><div id="chips" class="chips"></div><span class="micro">최근 키워드</span><div id="recent" class="recent"></div></div>
<div class="divider"></div>
<div class="section"><div class="section-title"><span class="num">02</span><h2>그림체 고르기</h2></div><div class="tools"><select id="cat"></select><input id="search" placeholder="그림체 검색"><label class="favonly"><input id="favOnly" type="checkbox"> 즐겨찾기만</label></div><div id="styles" class="styles"></div></div>
<div class="divider"></div>
<div class="section"><div class="section-title"><span class="num">03</span><h2>기본 설정</h2></div><div class="settings"><label><input id="five" type="checkbox" checked>정확히 5개 요소</label><label><input id="space" type="checkbox" checked>요소 간격 최대</label><label><input id="transparent" type="checkbox" checked>투명 PNG</label><label><input id="notext" type="checkbox" checked>글자·숫자·로고 금지</label></div></div>
</section>
<section class="panel"><div class="resultHead"><div class="section-title"><span class="num">04</span><h2>완성 프롬프트</h2></div><span id="styleBadge" class="styleBadge">파스텔 크레용</span></div><div class="selectedCard"><div><b id="selectedName">파스텔 크레용</b><small id="selectedDesc">부드러운 크레용·색연필 질감</small></div><div id="bigEmoji" class="bigEmoji">🖍️</div></div><textarea id="prompt" placeholder="왼쪽에서 키워드와 그림체를 고른 뒤 프롬프트 만들기를 눌러주세요."></textarea><div class="actions"><button id="copy" class="btn primary" type="button">📋 프롬프트 복사</button><button id="variation" class="btn" type="button">🔄 다른 요소 조합</button></div><button id="chat" class="btn rose chat" type="button">ChatGPT 열기 ↗</button><div id="msg" class="msg">준비 완료. 키워드를 골라보세요.</div></section>
</main></div>
<div class="mobilebar"><div><button id="copy2" class="btn primary" type="button">📋 복사</button><button id="chat2" class="btn rose" type="button">ChatGPT 열기</button></div></div>

const RANDOMS=["자동차","분리수거","카페","택배","이사","청소","여행","운동","병원","학교","쇼핑","반려동물","요리","빵집","농장","캠핑","우주","날씨","독서","게임","음악","사진","뷰티","세탁","정원","커피","도서관","시장","생일","선물","리뷰","말풍선","스마트폰","은행","공부","육아","사무실","주방","꽃","도시","공원","건강","취미","음식","디저트","가전","인테리어","축제","배달","미용실","치과","약국","꽃집","웨딩","반려견","반려묘","낚시","등산","자전거","문구","회의","택시","버스","기차","공항","호텔","미술관","공방","달력","체크리스트","포장","교육","안전","공구","기념일","응원","감사","쿠폰","할인","배송"];
const $=id=>document.getElementById(id);let selected=STYLES[0];const plusMonth=(m,p)=>((m-1+p)%12)+1;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function msg(t){$('msg').textContent=t}
function favs(){try{return JSON.parse(localStorage.getItem('moaFavs')||'[]')}catch(e){return []}}
function setFavs(v){try{localStorage.setItem('moaFavs',JSON.stringify(v))}catch(e){}}
function recents(){try{return JSON.parse(localStorage.getItem('moaRecent')||'[]')}catch(e){return []}}
function setRecent(k){let r=[k,...recents().filter(x=>x!==k)].slice(0,8);try{localStorage.setItem('moaRecent',JSON.stringify(r))}catch(e){}renderRecent()}
function renderRecent(){$('recent').innerHTML='';recents().forEach(k=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=k;b.onclick=()=>{$('keyword').value=k;build()};$('recent').appendChild(b)})}
function setMonthBadge(){const m=new Date().getMonth()+1;$('monthBadge').textContent=`${m}월 기준 → ${plusMonth(m,2)}월·${plusMonth(m,3)}월 추천`}
function renderCats(){const cats=['전체',...new Set(STYLES.map(s=>s.cat))];$('cat').innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
function updateSelected(){$('styleBadge').textContent=selected.name;$('selectedName').textContent=selected.name;$('selectedDesc').textContent=selected.desc;$('bigEmoji').textContent=selected.emoji}
function toggleFav(name){let f=favs();f=f.includes(name)?f.filter(x=>x!==name):[...f,name];setFavs(f);renderStyles()}
function renderStyles(){const c=$('cat').value||'전체',q=($('search').value||'').trim().toLowerCase(),fo=$('favOnly').checked,f=favs();$('styles').innerHTML='';let list=STYLES.filter(s=>(c==='전체'||s.cat===c)&&(!q||(s.name+s.cat+s.desc).toLowerCase().includes(q))&&(!fo||f.includes(s.name)));list.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='style'+(selected.name===s.name?' active':'');b.innerHTML=`<div class="thumb">${s.emoji}</div><strong>${s.name}</strong><small>${s.desc}</small><span class="star">${f.includes(s.name)?'★':'☆'}</span>`;b.onclick=e=>{if(e.target.classList.contains('star')){e.stopPropagation();toggleFav(s.name);return}selected=s;updateSelected();renderStyles();try{localStorage.setItem('moaStyle',s.name)}catch(e){}if($('keyword').value.trim())build();msg(s.name+' 선택 완료')};$('styles').appendChild(b)});if(!list.length)$('styles').innerHTML='<div style="color:#887a74;font-size:12px">조건에 맞는 그림체가 없어요.</div>'}
function renderChips(a){$('chips').innerHTML='';[...new Set(a)].slice(0,10).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=k;b.onclick=()=>{$('keyword').value=k;build()};$('chips').appendChild(b)})}
function season(){const m=new Date().getMonth()+1;renderChips(shuffle([...(MONTHS[plusMonth(m,2)]||[]),...(MONTHS[plusMonth(m,3)]||[])]));msg('2~3개월 뒤 시즌 키워드를 추천했어요.')}
function randomAny(){renderChips(shuffle(RANDOMS));msg('완전 랜덤 키워드를 추천했어요.')}
function build(){const k=$('keyword').value.trim()||'벚꽃';$('keyword').value=k;let p=`Create a cohesive stock illustration set of exactly 5 distinct, separate elements based on the theme: "${k}".\n\nSET COMPOSITION\n- Show exactly 5 standalone elements in one square asset sheet.\n- Make each element meaningfully different through object choice, pose, angle, or a small scene.\n`;if($('space').checked)p+='- CRITICAL: keep all 5 elements extremely far apart with the maximum practical negative space. Never overlap, touch, cluster, or visually connect them. Keep every element fully visible with generous transparent margin around each object so it can be cropped individually.\n';p+=`\nSTYLE\n${selected.prompt}.\n\nQUALITY\n- Premium commercial stock illustration quality, polished professional finish, high detail, crisp contours, clean color separation.\n- Generate at the largest square resolution available.\n- Preserve the exact same visual style, material, lighting, line weight, and color palette throughout.\n`;if($('transparent').checked)p+='\nTRANSPARENT PNG — REQUIRED\n- Isolate the artwork on a truly transparent background with a real alpha channel (RGBA).\n- No white, cream, colored, gradient, studio, paper, checkerboard, or photographic background.\n';if($('notext').checked)p+='- No text, letters, numbers, logos, signatures, or watermarks.\n';p+='- No floor plane, backdrop, full-canvas frame or border, mockup, or cast shadow outside the artwork.';$('prompt').value=p;setRecent(k);try{localStorage.setItem('moaKeyword',k)}catch(e){}msg('프롬프트를 만들었어요.')}
function variation(){build();$('prompt').value+='\n\nVARIATION RULE\n- Use a completely fresh set of five subjects or mini-scenes that are clearly different from common or previously used choices for this theme.\n- Keep the same selected art style, palette, transparency, and extreme spacing rules.';msg('다른 요소 조합 문구를 추가했어요.')}
async function copyPrompt(){if(!$('prompt').value.trim())build();const t=$('prompt').value;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);msg('✅ 프롬프트 복사 완료');return}}catch(e){}$('prompt').focus();$('prompt').select();try{if(document.execCommand('copy')){msg('✅ 프롬프트 복사 완료');return}}catch(e){}msg('전체 선택했어요. 기기 메뉴에서 복사를 눌러주세요.')}
function openChat(){window.open('https://chatgpt.com/','_blank','noopener')}
function restore(){try{const s=localStorage.getItem('moaStyle');const k=localStorage.getItem('moaKeyword');if(s)selected=STYLES.find(x=>x.name===s)||selected;if(k)$('keyword').value=k}catch(e){}}
window.addEventListener('error',e=>msg('오류: '+(e.message||'다시 시도해주세요.')));
document.addEventListener('DOMContentLoaded',()=>{restore();setMonthBadge();renderCats();renderRecent();updateSelected();renderStyles();season();$('season').onclick=season;$('random').onclick=randomAny;$('make').onclick=build;$('copy').onclick=copyPrompt;$('copy2').onclick=copyPrompt;$('variation').onclick=variation;$('chat').onclick=openChat;$('chat2').onclick=openChat;$('cat').onchange=renderStyles;$('search').oninput=renderStyles;$('favOnly').onchange=renderStyles;$('keyword').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();build()}};['five','space','transparent','notext'].forEach(id=>$(id).onchange=()=>{if($('prompt').value.trim())build()})})
})();
