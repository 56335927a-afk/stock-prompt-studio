<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PickStock HQ</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3f1}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="./?v=hqfix10" title="PickStock HQ"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)return;
    const bust='hqfix10-'+Date.now();
    const oldCss=d.querySelectorAll('link[href*="preview.css"]');
    oldCss.forEach(x=>x.remove());
    const css=d.createElement('link');
    css.rel='stylesheet';
    css.href='./preview.css?'+bust;
    d.head.appendChild(css);
    const s=d.createElement('script');
    s.src='./preview.js?'+bust;
    s.onload=()=>{console.log('HQ preview loaded')};
    d.body.appendChild(s);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
