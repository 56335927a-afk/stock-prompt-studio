<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PickStock HQ</title>
<style>html,body{margin:0;width:100%;min-height:100%;background:#f7f3f1}iframe{border:0;width:100%;height:100vh;display:block}</style>
</head>
<body>
<iframe id="app" title="PickStock HQ"></iframe>
<script>
(async()=>{
  const frame=document.getElementById('app');
  const bust='visible52-2-'+Date.now();
  try{
    const [htmlRes,cssRes,jsRes]=await Promise.all([
      fetch('./index.html?'+bust,{cache:'no-store'}),
      fetch('./preview.css?'+bust,{cache:'no-store'}),
      fetch('./preview.js?'+bust,{cache:'no-store'})
    ]);
    if(!htmlRes.ok||!cssRes.ok||!jsRes.ok) throw new Error('asset load failed');
    let html=await htmlRes.text();
    const css=await cssRes.text();
    const js=await jsRes.text();
    html=html.replace('<head>','<head><base href="https://56335927a-afk.github.io/stock-prompt-studio/">');
    html=html.replace(/<link[^>]+href=["']preview\.css[^"']*["'][^>]*>/gi,'');
    html=html.replace(/<script[^>]+src=["']preview\.js[^"']*["'][^>]*><\/script>/gi,'');
    html=html.replace('</head>','<style>'+css+'</style></head>');
    html=html.replace('</body>','<script>'+js.replace(/<\/script>/gi,'<\\/script>')+'<\/script></body>');
    frame.srcdoc=html;
  }catch(e){
    frame.src='./?fallback='+bust;
  }
})();
</script>
</body>
</html>
