name: Apply PickStock branding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update branding
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<title>MoA Prompt Studio</title>': '<title>PickStock</title>',
              '<h1>MoA Prompt Studio ✨</h1>': '<h1>PickStock ✨</h1>',
              '키워드와 그림체만 고르면 ChatGPT 이미지 생성에 바로 붙여넣을 수 있는 스톡 일러스트 프롬프트를 만들어요.': '키워드와 그림체만 고르면 생성형 AI에 바로 붙여넣을 수 있는 스톡 일러스트 프롬프트를 만들어요.',
              '<span class="badge">API 없음</span><span class="badge">추가 비용 없음</span>': ''
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update branding to PickStock"
          git push
