name: Activate verified previews
on:
  push:
    paths:
      - '.github/workflows/bump-verified-preview.yml'
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump preview asset versions
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'preview\.css\?v=\d+', 'preview.css?v=3', s)
          s=re.sub(r'preview\.js\?v=\d+', 'preview.js?v=3', s)
          p.write_text(s,encoding='utf-8')
      - name: Commit activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activate verified AI previews"
          git push
