name: Finalize HQ preview cache

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/finalize-hq-preview.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock final 4x13 HQ preview mapping and cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('preview.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const SPRITE='[^']+';", "const SPRITE='carrot-style-atlas-hq.avif?v=hqfinal1013b';", s, count=1)
          s = re.sub(r"const COLS=\d+, ROWS=\d+;", "const COLS=4, ROWS=13;", s, count=1)
          s = re.sub(r"background-size','[^']+'", "background-size','400% 1300%'", s, count=1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"preview\.css\?v=[^\"']+", "preview.css?v=hqfinal1013b", s)
          s = re.sub(r"preview\.js\?v=[^\"']+", "preview.js?v=hqfinal1013b", s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final preview wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Finalize HQ 4x13 carrot preview mapping"
            git push origin main
          fi
