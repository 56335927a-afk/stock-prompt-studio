name: Build clean verified preview sprite
on:
  push:
    paths:
      - '.github/workflows/build-preview-sprite.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        shell: bash
        run: |
          test -s verified-sprite.jpg
          python -m pip install --quiet pillow numpy
      - name: Reframe and sharpen 52 verified previews
        shell: python
        run: |
          from PIL import Image, ImageFilter
          import numpy as np
          from pathlib import Path

          src=Image.open('verified-sprite.jpg').convert('RGB')
          cols,rows=8,7
          out_w,out_h=480,300
          bg=(252,249,247)
          canvas=Image.new('RGB',(out_w*cols,out_h*rows),(250,247,245))

          def bbox_for(cell):
              a=np.asarray(cell).astype(np.int16)
              h,w=a.shape[:2]
              corner=np.concatenate([
                  a[:6,:6].reshape(-1,3),a[:6,-6:].reshape(-1,3),
                  a[-6:,:6].reshape(-1,3),a[-6:,-6:].reshape(-1,3)
              ],axis=0)
              base=np.median(corner,axis=0)
              dist=np.sqrt(((a-base)**2).sum(axis=2))
              mask=Image.fromarray((dist>20).astype('uint8')*255)
              mask=mask.filter(ImageFilter.MaxFilter(7)).filter(ImageFilter.MaxFilter(5))
              m=np.asarray(mask)>0
              seen=np.zeros((h,w),dtype=bool)
              comps=[]
              for yy in range(h):
                  for xx in range(w):
                      if not m[yy,xx] or seen[yy,xx]: continue
                      stack=[(xx,yy)];seen[yy,xx]=1;xs=[];ys=[]
                      while stack:
                          x,y=stack.pop();xs.append(x);ys.append(y)
                          for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                              if 0<=nx<w and 0<=ny<h and m[ny,nx] and not seen[ny,nx]:
                                  seen[ny,nx]=1;stack.append((nx,ny))
                      if len(xs)>=16:
                          x0,x1=min(xs),max(xs);y0,y1=min(ys),max(ys)
                          cx=(x0+x1)/2;cy=(y0+y1)/2
                          center_pen=((cx-w/2)/(w/2))**2+((cy-h/2)/(h/2))**2
                          score=len(xs)*(1.35-0.3*min(center_pen,1.0))
                          comps.append((score,x0,y0,x1+1,y1+1))
              if not comps: return (0,0,w,h)
              _,x0,y0,x1,y1=max(comps,key=lambda z:z[0])
              pad=max(3,int(min(w,h)*0.05))
              return (max(0,x0-pad),max(0,y0-pad),min(w,x1+pad),min(h,y1+pad))

          W,H=src.size
          for i in range(52):
              c=i%cols;r=i//cols
              x0=round(c*W/cols);x1=round((c+1)*W/cols)
              y0=round(r*H/rows);y1=round((r+1)*H/rows)
              cell=src.crop((x0,y0,x1,y1))
              crop=cell.crop(bbox_for(cell))
              maxw,maxh=410,255
              scale=min(maxw/crop.width,maxh/crop.height)
              nw=max(1,round(crop.width*scale));nh=max(1,round(crop.height*scale))
              art=crop.resize((nw,nh),Image.Resampling.LANCZOS)
              art=art.filter(ImageFilter.UnsharpMask(radius=1.0,percent=120,threshold=3))
              tile=Image.new('RGB',(out_w,out_h),bg)
              tile.paste(art,((out_w-nw)//2,(out_h-nh)//2))
              canvas.paste(tile,(c*out_w,r*out_h))

          canvas.save('verified-sprite-clean.jpg','JPEG',quality=95,subsampling=0,optimize=True)
          print('source',src.size,'output',canvas.size,Path('verified-sprite-clean.jpg').stat().st_size)
          assert canvas.size==(3840,2100)
      - name: Commit clean preview image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified-sprite-clean.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Build clean AI preview sprite"
          git push
