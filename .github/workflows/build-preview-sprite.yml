name: Build high-resolution verified preview sprite
on:
  push:
    paths:
      - 'hires_parts/**'
      - '.github/workflows/build-preview-sprite.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode high-resolution preview image
        shell: bash
        run: |
          cat hires_parts/*.txt | tr -d '\n\r ' | base64 -d > verified-sprite-hi.webp
          test -s verified-sprite-hi.webp
      - name: Commit high-resolution preview image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified-sprite-hi.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add high-resolution verified AI preview sprite"
          git push
