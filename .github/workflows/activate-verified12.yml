name: Activate verified preview v12
on:
  push:
    paths:
      - '.github/workflows/activate-verified12.yml'
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump preview cache versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'preview\.css\?v=\d+', 'preview.css?v=12', s)
          s=re.sub(r'preview\.js\?v=\d+', 'preview.js?v=12', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Activate verified preview v12"
          git push
